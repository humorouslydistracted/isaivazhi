name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the legacy "tools" package, which
          # current sdkmanager no longer provides, failing the job.
          packages: platform-tools

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        env:
          ISAIVAZHI_KEYSTORE_BASE64: ${{ secrets.ISAIVAZHI_KEYSTORE_BASE64 }}
          ISAIVAZHI_KEYSTORE_PASSWORD: ${{ secrets.ISAIVAZHI_KEYSTORE_PASSWORD }}
          ISAIVAZHI_KEY_ALIAS: ${{ secrets.ISAIVAZHI_KEY_ALIAS }}
          ISAIVAZHI_KEY_PASSWORD: ${{ secrets.ISAIVAZHI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
